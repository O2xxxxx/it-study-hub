server:
  port: 8080
  servlet:
    session:
      timeout: 7d
      cookie:
        name: ITSESSION
        http-only: true
        same-site: lax

spring:
  application:
    name: it-study-hub
  profiles:
    active: dev
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 12
      minimum-idle: 2
      connection-timeout: 5000
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

app:
  points:
    article-publish: 5
    answer-create: 3
  storage:
    resource-dir: ../resources-data
  cors:
    allowed-origins: "${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}"

logging:
  level:
    com.itstudy: info
